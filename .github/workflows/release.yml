name: release
on:
  push:
    tags: ["v*"]

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install PySide6 PyYAML pyinstaller
      - run: pyinstaller packaging/pyinstaller-win.spec
      - uses: actions/upload-artifact@v4
        with: { name: FileOrganizer-windows, path: dist/FileOrganizer.exe }

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install PySide6 PyYAML pyinstaller
      - run: pyinstaller packaging/pyinstaller-mac.spec
      - run: brew install create-dmg
      - run: create-dmg --window-size 500 300 --app-drop-link 375 100 dist/FileOrganizer.dmg dist/FileOrganizer.app
      - uses: actions/upload-artifact@v4
        with: { name: FileOrganizer-macos, path: dist/*.dmg }

  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash packaging/build-deb.sh
      - run: sudo apt-get update && sudo apt-get install -y ./dist/*.deb
      - run: desktop-file-validate /usr/share/applications/file-organizer.desktop
      - name: launch smoke test (124 = GUI stayed open, good)
        run: |
          code=0
          QT_QPA_PLATFORM=offscreen timeout 20 /usr/bin/file-organizer || code=$?
          test "$code" -eq 124
      - uses: actions/upload-artifact@v4
        with: { name: FileOrganizer-deb, path: dist/*.deb }

  linux-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: bash packaging/build-generic-rpm.sh
      - uses: actions/upload-artifact@v4
        with: { name: FileOrganizer-rpm, path: dist/*.rpm }

  publish:
    needs: [windows-exe, macos-dmg, linux-deb, linux-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
